[package]
name = "astrabrew-launcher-mac"
version = "0.2.1"
edition = "2024"
description = "Native macOS launcher for AstraBrew-Labs"
license = "MIT"
publish = false

[dependencies]
iced = { version = "0.14.0", features = ["advanced", "canvas", "image", "markdown", "tokio"] }
lucide-icons = { version = "1.31.0", features = ["iced"] }
# Astra UI 组件库：从 GitHub beta 分支引入（包名为 iced-astraui，crate 名为 astra_ui）
astra_ui = { git = "https://github.com/AstraBrew-Labs/iced-astraui", branch = "beta", package = "iced-astraui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 角色卡 PNG 元数据使用标准解码器校验 CRC，并读取 tEXt/zTXt/iTXt 文本块。
png = "0.18"
# 兼容角色卡常见的标准与 URL-safe Base64 元数据编码。
base64 = "0.22"
# 保持角色卡原有 zTXt 压缩文本块格式时需要重新压缩元数据。
flate2 = "1.1"
# 资源工作台将大型预设解析、表单准备和文件保存放入阻塞线程池。
tokio = { version = "1", features = ["rt", "time"] }
# 严格解析 SillyTavern 输出的 Go to 访问地址，避免误取代理 URL。
regex = "1.11"
# 服务器访问弹窗为 IPv4/IPv6 地址生成二维码。
qrcode = { version = "0.14", default-features = false }
# 无损编辑配置，保留未知字段及未修改部分的注释。
yaml-edit = "=0.3.1"
reqwest = { version = "0.12", default-features = true, features = ["blocking", "socks"] }
rfd = "0.15"
# 安全校验并解压离线扩展 ZIP 包。
zip = { version = "2", default-features = false, features = ["deflate"] }
# 枚举并读取 macOS 已安装字体，供界面动态切换。
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap"] }
# 启动器自动更新：读取 latest.json、minisign 校验签名并替换 .app 包。
cargo-packager-updater = "0.2"

# macOS 原生窗口定制（禁用绿色缩放按钮、移除独占全屏、设置 Dock 应用图标），版本与 winit 保持一致以去重
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSEnumerator", "NSThread", "dispatch"] }
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSWindow", "NSButton", "NSControl", "NSScreen", "NSImage"] }
# 桌面模式 WebView 使用与 WebKit 绑定一致的 objc2 0.6 依赖，别名避免影响现有窗口代码。
objc2_06 = { package = "objc2", version = "0.6.4" }
objc2_foundation_06 = { package = "objc2-foundation", version = "0.3.2", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSString", "NSURL", "NSURLRequest", "NSValue"] }
objc2_app_kit_06 = { package = "objc2-app-kit", version = "0.3.2", features = ["NSApplication", "NSWindow", "NSOpenPanel", "NSWorkspace", "NSResponder", "NSView", "objc2-uniform-type-identifiers"] }
objc2_uniform_type_identifiers_06 = { package = "objc2-uniform-type-identifiers", version = "0.3.2" }
objc2-web-kit = { version = "0.3.2", features = ["WKContentWorld", "WKNavigation", "WKNavigationAction", "WKNavigationResponse", "WKOpenPanelParameters", "WKScriptMessage", "WKUserContentController", "WKUserScript", "WKWebView", "WKWebViewConfiguration"] }
block2 = "0.6.2"

[profile.release]
lto = "thin"
strip = true

# ── 打包配置（cargo packager）────────────────────────────────────────────────
# 用 `[package.metadata.packager]` 而不是独立的 `Packager.toml`：只有走 Cargo.toml 这条路
# 时 `version` 才会自动取自 `[package].version`；独立的配置文件必须把版本号再写一遍，
# 两处一旦不同步，打出来的包版本就会和更新清单对不上。
# 另外 cargo-packager 只负责打包、不会编译，二进制必须先由 `build.sh` 放到 binaries_dir。
[package.metadata.packager]
product_name = "AstraBrew Launcher"
identifier = "cn.astrabrew.launcher"
icons = ["assets/icon/icon.icns"]
out_dir = "dist"
binaries_dir = "target/current/release"

[package.metadata.packager.macos]
minimum_system_version = "10.15"

# ── 构建渠道开关（build.sh 与 .github/workflows/release.yml 读取）────────────
#   beta = true  → 测试版：二进制注入 `ASTRA_BUILD_CHANNEL=beta`，左上角显示「测试版」标记，
#                  发布 tag 用 `beta-v{版本}`。
#   beta = false 或整块省略 → 正式版（左上角无标记，tag 用 `v{版本}`）。
# 注意：**不能**放进上面的 `[package.metadata.packager]` —— cargo-packager 的配置是
# `deny_unknown_fields`，会直接报 `unknown field \`beta\``，导致打包失败。
[package.metadata.astrabrew]
beta = true


