[package]
name = "astrabrew-launcher-mac"
version = "0.1.0"
edition = "2024"

[package.metadata.bundle]
name = "AstraBrew Launcher"

[dependencies]
eframe = { version = "0.33", features = ["default"] }
egui = "0.33"
egui_extras = { version = "0.33", features = ["all_loaders"] }
egui-phosphor = "0.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json"] }
objc = "0.2"
rfd = "0.15"
jwalk = "0.8"
# 桌面模式 WebView（直接 objc2，绕开 tao 主线程限制）
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
zip = "2"