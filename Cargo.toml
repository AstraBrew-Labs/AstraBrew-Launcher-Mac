[package]
name = "astrabrew-launcher-mac"
version = "0.0.1"
edition = "2024"

[package.metadata.packager]
productName = "AstraBrew Launcher"
identifier = "cn.astrabrew.launcher"
icons = ["icons/icon.icns"]
beforePackagingCommand = "cargo build --release"
outDir = "dist"
# Universal Binary
binaries-dir = "target/universal/release"

[package.metadata.packager.macos]
minimumSystemVersion = "10.15"

[dependencies]
eframe = { version = "0.33", features = ["default"] }
egui = "0.33"
egui_extras = { version = "0.33", features = ["all_loaders"] }
egui-phosphor = "0.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json"] }
objc = "0.2"
rfd = "0.15"
jwalk = "0.8"
# 桌面模式 WebView（直接 objc2，绕开 tao 主线程限制）
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["objc2-uniform-type-identifiers"] }
objc2-foundation = "0.3"
objc2-uniform-type-identifiers = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
zip = "2"
# 二维码生成（访问酒馆弹窗）
qrcode = "0.14"
# macOS 开机自启动（SMAppService 封装，需 macOS 13+）
smappservice-rs = "0.1"
# 自动更新（cargo-packager-updater）
cargo-packager-updater = "0.2"