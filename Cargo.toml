[package]
name = "astrabrew-launcher-mac"
version = "0.1.0"
edition = "2024"

[package.metadata.bundle]
name = "AstraBrew Launcher"

[dependencies]
eframe = "0.33"
egui = "0.33"
egui-phosphor = "0.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json"] }
objc = "0.2"
rfd = "0.15"
jwalk = "0.8"
wry = "0.53"