name: 发布 macOS

on:
push:
paths:
- Cargo.toml
workflow_dispatch:

permissions:
contents: write

jobs:
release:
name: 构建并发布
runs-on: macos-latest

```
env:
  APP_NAME: "AstraBrew Launcher"

steps:
  - name: 检出仓库
    uses: actions/checkout@v4

  - name: 安装 Rust
    uses: dtolnay/rust-toolchain@stable
    with:
      targets: aarch64-apple-darwin,x86_64-apple-darwin

  - name: 安装 cargo-packager
    run: cargo install cargo-packager --locked

  - name: 读取版本号
    id: version
    shell: bash
    run: |
      VERSION=$(grep '^version =' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
      echo "version=$VERSION" >> $GITHUB_OUTPUT
      echo "检测到版本：$VERSION"

  - name: 检查 Release 是否存在
    id: release_check
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
        echo "exists=true" >> $GITHUB_OUTPUT
        echo "Release 已存在"
      else
        echo "exists=false" >> $GITHUB_OUTPUT
        echo "开始构建"
      fi

  - name: 已存在则结束
    if: steps.release_check.outputs.exists == 'true'
    run: |
      echo "版本已存在，无需重复发布"
      exit 0

  - name: 构建 Universal 版本
    run: |
      cargo packager \
        --release \
        --target universal-apple-darwin

  - name: 查找 app.tar.gz
    id: archive
    run: |
      FILE=$(find target -name "*.app.tar.gz" | head -n1)
      echo "file=$FILE" >> $GITHUB_OUTPUT
      echo "找到更新包：$FILE"

  - name: 查找 DMG
    id: dmg
    run: |
      FILE=$(find target -name "*.dmg" | head -n1)
      echo "file=$FILE" >> $GITHUB_OUTPUT
      echo "找到安装包：$FILE"

  - name: 更新包签名
    env:
      CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.PACKAGER_PRIVATE_KEY }}
    run: |
      cargo packager signer sign "${{ steps.archive.outputs.file }}"

  - name: 查找 sig 文件
    id: sig
    run: |
      FILE=$(find target -name "*.sig" | head -n1)
      echo "file=$FILE" >> $GITHUB_OUTPUT

  - name: 读取签名内容
    id: signature
    run: |
      SIGNATURE=$(cat "${{ steps.sig.outputs.file }}" | tr -d '\n')
      echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT

  - name: 生成 latest.json
    run: |
      cat > latest.json <<EOF
      {
        "version":"${{ steps.version.outputs.version }}",
        "notes":"新版本发布",
        "pub_date":"$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
        "platforms":{
          "darwin-universal":{
            "signature":"${{ steps.signature.outputs.signature }}",
            "url":"https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/${APP_NAME}.app.tar.gz"
          }
        }
      }
      EOF

  - name: 创建 Release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: v${{ steps.version.outputs.version }}
      name: v${{ steps.version.outputs.version }}
      generate_release_notes: true
      files: |
        ${{ steps.archive.outputs.file }}
        ${{ steps.sig.outputs.file }}
        ${{ steps.dmg.outputs.file }}
        latest.json
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  - name: 发布完成
    run: |
      echo ""
      echo "===================================="
      echo "版本 v${{ steps.version.outputs.version }} 发布成功"
      echo ""
      echo "上传文件："
      echo "✓ ${APP_NAME}.dmg"
      echo "✓ ${APP_NAME}.app.tar.gz"
      echo "✓ ${APP_NAME}.app.tar.gz.sig"
      echo "✓ latest.json"
      echo "===================================="
```
