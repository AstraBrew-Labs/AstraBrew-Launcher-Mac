name: 发布 macOS

on:
  push:
    paths:
      - Cargo.toml
      - Packager.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: macos-latest

    env:
      APP_NAME: "AstraBrew Launcher"

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 安装 cargo-packager
        run: cargo install cargo-packager --locked

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 检查 Release 是否已存在
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release 已存在则结束
        if: steps.check_release.outputs.exists == 'true'
        run: exit 0

      - name: 编译 ARM64
        run: cargo build --release --target aarch64-apple-darwin

      - name: 编译 Intel
        run: cargo build --release --target x86_64-apple-darwin

      - name: 合并 Universal Binary
        run: |
          mkdir -p target/universal/release

          lipo \
            target/aarch64-apple-darwin/release/astrabrew-launcher-mac \
            target/x86_64-apple-darwin/release/astrabrew-launcher-mac \
            -create \
            -output target/universal/release/astrabrew-launcher-mac

          file target/universal/release/astrabrew-launcher-mac

      - name: 打包 Universal DMG
        run: |
          cargo packager --release

      - name: 查找 .app
        id: app
        run: |
          APP=$(find dist -name "*.app" | head -n1)

          if [ -z "$APP" ]; then
            echo ".app 不存在"
            find dist
            exit 1
          fi

          echo "app=$APP" >> "$GITHUB_OUTPUT"

      # 删除 cargo-packager 自动产生的 ad-hoc 签名
      - name: 删除签名
        run: |
          codesign --remove-signature "${{ steps.app.outputs.app }}" || true
          xattr -cr "${{ steps.app.outputs.app }}"

      - name: 生成更新包
        run: |
          tar czf "AstraBrew-Launcher_universal.app.tar.gz" \
            -C "$(dirname "${{ steps.app.outputs.app }}")" \
            "$(basename "${{ steps.app.outputs.app }}")"

      - name: 签名更新包
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.PACKAGER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
        run: |
          cargo packager signer sign "AstraBrew-Launcher_universal.app.tar.gz"

      - name: 读取更新签名
        id: signature
        run: |
          SIGNATURE=$(tr -d '\n' < AstraBrew-Launcher_universal.app.tar.gz.sig)
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"

      - name: 查找 DMG
        id: dmg
        run: |
          FILE=$(find dist -name "*.dmg" | head -n1)

          if [ -z "$FILE" ]; then
            echo "没有找到 dmg"
            find dist
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: 生成 latest.json
        run: |
          cat > latest.json <<EOF
          {
            "version":"${{ steps.version.outputs.version }}",
            "notes":"新版本发布",
            "pub_date":"$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms":{
              "darwin-universal":{
                "signature":"${{ steps.signature.outputs.signature }}",
                "url":"https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/AstraBrew-Launcher_universal.app.tar.gz"
              }
            }
          }
          EOF

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            AstraBrew-Launcher_universal.app.tar.gz
            AstraBrew-Launcher_universal.app.tar.gz.sig
            ${{ steps.dmg.outputs.file }}
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}