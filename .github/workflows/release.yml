name: 发布 macOS

on:
  push:
    paths:
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: macos-latest

    env:
      APP_NAME: AstraBrew Launcher

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 安装 cargo-packager
        run: cargo install cargo-packager --locked

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 检查 Release 是否已存在
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release 已存在则结束
        if: steps.check_release.outputs.exists == 'true'
        run: exit 0

      - name: 构建 ARM64
        run: cargo build --release --target aarch64-apple-darwin

      - name: 构建 Intel
        run: cargo build --release --target x86_64-apple-darwin

      - name: 合并 Universal Binary
        run: |
          mkdir -p target/universal/release

          lipo \
          target/aarch64-apple-darwin/release/astrabrew-launcher-mac \
          target/x86_64-apple-darwin/release/astrabrew-launcher-mac \
          -create \
          -output target/universal/release/astrabrew-launcher-mac

      - name: 打包 DMG
        run: cargo packager --release

      - name: 查找更新包
        id: archive
        run: |
          FILE=$(find dist -name "*.app.tar.gz" | head -n1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: 查找 DMG
        id: dmg
        run: |
          FILE=$(find dist -name "*.dmg" | head -n1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: 对更新包签名
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.PACKAGER_PRIVATE_KEY }}
        run: |
          cargo packager signer sign "${{ steps.archive.outputs.file }}"

      - name: 获取签名文件
        id: sig
        run: |
          echo "file=${{ steps.archive.outputs.file }}.sig" >> "$GITHUB_OUTPUT"

      - name: 读取签名
        id: signature
        run: |
          SIGNATURE=$(tr -d '\n' < "${{ steps.sig.outputs.file }}")
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"

      - name: 生成 latest.json
        run: |
          cat > latest.json <<EOF
          {
            "version":"${{ steps.version.outputs.version }}",
            "notes":"新版本发布",
            "pub_date":"$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms":{
              "darwin-universal":{
                "signature":"${{ steps.signature.outputs.signature }}",
                "url":"https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/${APP_NAME}.app.tar.gz"
              }
            }
          }
          EOF

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.archive.outputs.file }}
            ${{ steps.sig.outputs.file }}
            ${{ steps.dmg.outputs.file }}
            latest.json