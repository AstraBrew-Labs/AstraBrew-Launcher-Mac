name: 发布 macOS

on:
  push:
    paths:
      - Cargo.toml
      - Packager.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: macos-latest

    env:
      APP_NAME: AstraBrew Launcher

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 安装 cargo-packager
        run: cargo install cargo-packager --locked

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 检查 Release 是否已存在
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release 已存在则结束
        if: steps.check_release.outputs.exists == 'true'
        run: exit 0

      - name: 编译双架构二进制
        run: |
          echo "=== 编译 ARM64 架构 ==="
          cargo build --release --target aarch64-apple-darwin
          
          echo "=== 编译 Intel 架构 ==="
          cargo build --release --target x86_64-apple-darwin

      - name: 移除打包配置文件中默认的自动编译命令防止覆盖
        shell: bash
        run: |
          # 移除 Packager.toml 或 Cargo.toml 里的 before-packaging 编译钩子，采用我们手动编译好的二进制进行插拔打包
          if [ -f Packager.toml ]; then
            sed -i.bak -e 's/before-packaging-command.*=.*//g' -e 's/beforePackagingCommand.*=.*//g' -e 's/before_packaging_command.*=.*//g' Packager.toml
          fi
          if [ -f Cargo.toml ]; then
            sed -i.bak -e 's/before-packaging-command.*=.*//g' -e 's/before_packaging_command.*=.*//g' Cargo.toml
          fi

      - name: 分阶段生成全架构安装包 (引入双重 Ad-hoc 代码签名机制)
        shell: bash
        run: |
          # 创建统一暂存区
          mkdir -p dist-packages
          mkdir -p target/universal/release

          # -------------------- 1. 打包 ARM64 版本 --------------------
          echo "===== 正在打包 ARM64 ====="
          cp target/aarch64-apple-darwin/release/astrabrew-launcher-mac target/universal/release/astrabrew-launcher-mac
          
          # 【步骤 1】打包前：强制对准备封装的二进制文件进行 ad-hoc 签名
          codesign --force --options runtime --sign - target/universal/release/astrabrew-launcher-mac
          
          cargo packager --release

          APP_PATH=$(find dist -name "*.app" | head -n1)
          DMG_PATH=$(find dist -name "*.dmg" | head -n1)
          
          if [ -n "$APP_PATH" ]; then
            # 【步骤 2】打包后：深度签名 .app 目录，确保更新包合规
            codesign --force --deep --options runtime --sign - "$APP_PATH"
            tar czf "dist-packages/AstraBrew-Launcher_aarch64.app.tar.gz" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"
          fi
          if [ -n "$DMG_PATH" ]; then
            # 【步骤 3】对打包生成的 .dmg 进行代码签名
            codesign --force --sign - "$DMG_PATH"
            cp "$DMG_PATH" "dist-packages/AstraBrew-Launcher_aarch64.dmg"
          fi
          rm -rf dist/*

          # -------------------- 2. 打包 Intel (x64) 版本 --------------------
          echo "===== 正在打包 Intel ====="
          cp target/x86_64-apple-darwin/release/astrabrew-launcher-mac target/universal/release/astrabrew-launcher-mac
          
          # 【步骤 1】打包前：强制对准备封装的二进制文件进行 ad-hoc 签名
          codesign --force --options runtime --sign - target/universal/release/astrabrew-launcher-mac
          
          cargo packager --release

          APP_PATH=$(find dist -name "*.app" | head -n1)
          DMG_PATH=$(find dist -name "*.dmg" | head -n1)
          
          if [ -n "$APP_PATH" ]; then
            # 【步骤 2】打包后：深度签名 .app 目录
            codesign --force --deep --options runtime --sign - "$APP_PATH"
            tar czf "dist-packages/AstraBrew-Launcher_x64.app.tar.gz" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"
          fi
          if [ -n "$DMG_PATH" ]; then
            # 【步骤 3】对打包生成的 .dmg 进行代码签名
            codesign --force --sign - "$DMG_PATH"
            cp "$DMG_PATH" "dist-packages/AstraBrew-Launcher_x64.dmg"
          fi
          rm -rf dist/*

          # -------------------- 3. 打包 Universal 版本 --------------------
          echo "===== 正在合成并打包 Universal ====="
          lipo \
            target/aarch64-apple-darwin/release/astrabrew-launcher-mac \
            target/x86_64-apple-darwin/release/astrabrew-launcher-mac \
            -create \
            -output target/universal/release/astrabrew-launcher-mac

          echo "===== 验证合并后的二进制架构 ====="
          file target/universal/release/astrabrew-launcher-mac

          # 【步骤 1】打包前：强制对准备封装的 Universal 二进制进行 ad-hoc 签名
          codesign --force --options runtime --sign - target/universal/release/astrabrew-launcher-mac

          cargo packager --release

          APP_PATH=$(find dist -name "*.app" | head -n1)
          DMG_PATH=$(find dist -name "*.dmg" | head -n1)
          
          if [ -n "$APP_PATH" ]; then
            # 【步骤 2】打包后：深度签名 .app 目录
            codesign --force --deep --options runtime --sign - "$APP_PATH"
            tar czf "dist-packages/AstraBrew-Launcher_universal.app.tar.gz" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"
          fi
          if [ -n "$DMG_PATH" ]; then
            # 【步骤 3】对打包生成的 .dmg 进行代码签名
            codesign --force --sign - "$DMG_PATH"
            cp "$DMG_PATH" "dist-packages/AstraBrew-Launcher_universal.dmg"
          fi
          rm -rf dist/*

      - name: 对所有更新包进行签名
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.PACKAGER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
        run: |
          echo "=== 签名 ARM64 升级包 ==="
          cargo packager signer sign "dist-packages/AstraBrew-Launcher_aarch64.app.tar.gz"
          
          echo "=== 签名 Intel 升级包 ==="
          cargo packager signer sign "dist-packages/AstraBrew-Launcher_x64.app.tar.gz"
          
          echo "=== 签名 Universal 升级包 ==="
          cargo packager signer sign "dist-packages/AstraBrew-Launcher_universal.app.tar.gz"

      - name: 生成包含全架构配置的 latest.json
        shell: bash
        run: |
          SIG_AARCH64=$(tr -d '\n' < "dist-packages/AstraBrew-Launcher_aarch64.app.tar.gz.sig")
          SIG_X64=$(tr -d '\n' < "dist-packages/AstraBrew-Launcher_x64.app.tar.gz.sig")
          SIG_UNIVERSAL=$(tr -d '\n' < "dist-packages/AstraBrew-Launcher_universal.app.tar.gz.sig")

          cat > latest.json <<EOF
          {
            "version":"${{ steps.version.outputs.version }}",
            "notes":"新版本全架构发布 (Apple Silicon, Intel & Universal)",
            "pub_date":"$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms":{
              "darwin-aarch64":{
                "signature":"$SIG_AARCH64",
                "url":"https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/AstraBrew-Launcher_aarch64.app.tar.gz"
              },
              "darwin-x86_64":{
                "signature":"$SIG_X64",
                "url":"https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/AstraBrew-Launcher_x64.app.tar.gz"
              },
              "darwin-universal":{
                "signature":"$SIG_UNIVERSAL",
                "url":"https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/AstraBrew-Launcher_universal.app.tar.gz"
              }
            }
          }
          EOF

      - name: 创建 Release 并上传全架构文件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist-packages/*
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}